[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-log"
version = "0.0.1"
description = "Local-first private voice journal"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8"]
desktop = ["PySide6>=6.7"]
microphone = ["sounddevice>=0.5.1,<0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_log = ["recording/*.json", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
